name: hamishphipps
description: "A new Flutter project."
publish_to: "none"
version: 0.2.5+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_screenutil:
  flutter_svg: ^2.2.4
  fluttertoast:
  get: ^4.7.3
  google_fonts: ^8.0.2
  image_picker: ^1.2.1
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  sqflite:
  logger: ^2.7.0
  lottie: ^3.1.0
  pinput:
  shared_preferences: ^2.5.4
  shimmer:
  upgrader: ^13.5.0
  url_launcher:
  gradient_borders: ^1.0.2
